name: Build and test (.NET)
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/PreviewLab/PreviewLab.csproj -c Release
      - name: Run integration contract tests
        run: dotnet run --project tests/PreviewLab.Tests/PreviewLab.Tests.csproj -c Release
